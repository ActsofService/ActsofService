name: Build projects.json

on:
  push:
    branches: [main]
    paths:
      - 'content/projects/**'
      - 'images/uploads/**'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install gray-matter sharp

      - run: node scripts/build-thumbnails.js

      - run: node scripts/build-projects.js

      - name: Commit projects.json and thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json images/thumbs
          git diff --staged --quiet || git commit -m "Update projects.json and thumbnails"
          git push
