<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Acts of Service</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="screensaver.css">

    <style>
        @font-face {
            font-family: 'ABC Areal';
            src: url('fonts/ABCArealSuperfamilyVariable.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'ABC Areal', Arial, sans-serif;
            font-size: 1.05rem;
            line-height: 1.15;
            overflow: hidden;
        }

        main {
            margin: 0 20px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 510px;
            gap: 40px;
            text-align: left;
            flex: 1;
            overflow: hidden;
        }

        .contact-left {
            min-width: 0;
        }

        .intro {
            margin: 0;
        }

        .profile-images {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: flex-start;
        }

        .profile-image {
            position: relative;
            display: block;
            cursor: none;
        }

        .profile-image img {
            width: auto;
            height: 35vh;
            margin-top: 0;
            display: block;
        }

        /*
         * This moves the right column down so that
         * "CLIENTS" lines up with the top of the images.
         */
        .contact-extra {
            width: 510px;
            align-self: start;
            margin-top: 1.05rem;
        }

        .contact-extra section {
            margin-bottom: 1.5rem;
        }

        .contact-extra h3 {
            margin: 0;
            font-size: inherit;
            font-weight: normal;
        }

        .contact-extra p {
            margin: 0;
        }

        .contact-extra ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .contact-extra li {
            margin: 0;
        }

        footer {
            margin: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.05rem;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Custom name cursor */

        .name-cursor {
            position: fixed;
            left: 0;
            top: 0;
            transform: translate(10px, 10px);
            pointer-events: none;
            opacity: 0;
            z-index: 9999;
            font-size: 1.05rem;
            line-height: 1;
            white-space: nowrap;
            transition: opacity 0.1s ease;
        }

        .name-cursor.visible {
            opacity: 1;
        }

        /* Tablet */

        @media (max-width: 1100px) {
            body {
                overflow: auto;
            }

            main {
                grid-template-columns: 1fr;
                gap: 20px;
                overflow: visible;
            }

            .contact-extra {
                width: auto;
                margin-top: 0;
            }

            footer {
                position: static;
            }
        }

        /* Mobile */

        @media (max-width: 700px) {
            body {
                overflow: auto;
            }

            main {
                grid-template-columns: 1fr;
                margin: 0 20px;
            }

            .profile-images {
                flex-wrap: wrap;
            }

            .profile-image img {
                height: 30vh;
            }

            .profile-image {
                cursor: auto;
            }

            .name-cursor {
                display: none;
            }

            footer {
                margin: 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <main>

        <div class="contact-left">

            <p class="intro">
                Acts of Service is a design studio based in Stockholm, Sweden.
                We work across graphic design, art direction, typography and
                visual identities.
            </p>

            <div class="profile-images">

                <div class="profile-image" data-name="EMMY">
                    <img src="images/uploads/Emmy_profil.png" alt="Emmy">
                </div>

                <div class="profile-image" data-name="OLLE">
                    <img src="images/uploads/Olle_profil.png" alt="Olle">
                </div>

                <div class="profile-image" data-name="MOLLY">
                    <img src="images/uploads/Molly_profil.png" alt="Molly">
                </div>

            </div>

        </div>


        <div class="contact-extra" id="contact-extra">
            <!-- Content from contact.json will appear here -->
        </div>

    </main>


    <footer>
        <div>
            <a href="index.html">Home</a>
        </div>

        <div>
            <a href="archive.html">Archive</a>
        </div>

        <div>
            <a href="contact.html">Contact</a>
        </div>

        <div>
            <a href="foundry.html">Foundry</a>
        </div>
    </footer>


    <!-- Name cursor -->

    <div class="name-cursor" id="name-cursor"></div>


    <script src="screensaver.js"></script>

    <script>
        /*
         * Load contact information from contact.json
         */

        fetch('contact.json')
            .then(response => response.json())
            .then(data => {

                const contactExtra = document.getElementById('contact-extra');

                contactExtra.innerHTML = '';

                Object.entries(data).forEach(([section, content]) => {

                    const sectionElement = document.createElement('section');

                    const heading = document.createElement('h3');
                    heading.textContent = section;

                    sectionElement.appendChild(heading);

                    if (Array.isArray(content)) {

                        const list = document.createElement('ul');

                        content.forEach(item => {

                            const li = document.createElement('li');
                            li.textContent = item;

                            list.appendChild(li);

                        });

                        sectionElement.appendChild(list);

                    } else {

                        const paragraph = document.createElement('p');
                        paragraph.textContent = content;

                        sectionElement.appendChild(paragraph);
                    }

                    contactExtra.appendChild(sectionElement);
                });

            })
            .catch(error => {
                console.error('Could not load contact.json:', error);
            });


        /*
         * Custom cursor for profile images
         */

        const nameCursor = document.getElementById('name-cursor');
        const profileImages = document.querySelectorAll('.profile-image');

        profileImages.forEach(profile => {

            profile.addEventListener('mouseenter', () => {
                nameCursor.textContent = profile.dataset.name;
                nameCursor.classList.add('visible');
            });

            profile.addEventListener('mousemove', event => {

                nameCursor.style.left = event.clientX + 'px';
                nameCursor.style.top = event.clientY + 'px';

            });

            profile.addEventListener('mouseleave', () => {
                nameCursor.classList.remove('visible');
            });

        });
    </script>

</body>
</html>
