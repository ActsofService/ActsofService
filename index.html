<head>

    <title>Acts of Service</title>
    <link rel="icon" type="image/svg+xml" href="aos-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="screensaver.css">
    <style>
        @font-face {
            font-family: "ABC Areal";
            src: url("fonts/ABCArealSuperfamilyVariable.woff2") format("woff2");
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
        }
    </style>
    <style>
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 50;
            font-weight: 400;
            font-style: normal;
            position: fixed;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        footer {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 0;
            z-index: 10;
            margin: 0;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 0;
            font-weight: 400;
            line-height: 60%;
            font-size: 2.2rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        main {
            margin: 0px 20px;
            padding-right: calc(100% - 450px);
            text-align: left;
            flex: 1;
            font-size: 1.3rem;
            height: 10vh;
        }
        .titel {
            font-size: 16rem;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 0;
            font-kerning: normal;
            letter-spacing: -0.125em;
            color:#3de3f2;
            font-weight: 1000;
            line-height: 60%;
            width: calc(100vw - 40px);
            padding-right: -500px;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        a:hover {
            color:#3de3f2;
        }

        @media (max-width: 1100px) {
        footer {
            font-size: 1.3rem;
        }
        .titel {
            font-size: 8rem;
        }
        }
    </style>
</head>
<body>
    <header>
 
    </header>
    <main>
        <p>Our love language is <em>acts of service</em>, a love language where we show care through helpful, practical actions that make daily life easier</p>
        <div class="titel"> <p>Acts of service</p></div>
    </main>
    <footer>
