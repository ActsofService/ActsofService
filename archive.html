<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subpage — Acts of Service</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="screensaver.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
      <style>
        html,
    body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: "IBM Plex Mono", monospace;
            font-variation-settings: "wght" 400;
            font-weight: 400;
            font-style: normal;
            display: flex;
            font-variation-settings: "wght" 100;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }
        footer {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 0;
            z-index: 10;
            margin: 0;
            font-family: Arial, sans-serif;
            font-weight: 400;
            line-height: 60%;
            font-size: 2.2rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }
        header {
            position: fixed;
            z-index: 1001;
            font-family: Arial, sans-serif;
            font-size: 2.2rem;
            line-height: 1;
            text-align: left;
            pointer-events: none;
        }
        header h1{
            margin: 20px 0px 0px 20px;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        a:hover {
            color: greenyellow;
        }
        main {
            margin: 0px 20px;
            padding: 100px 0;
            text-align: center;
            flex: 1;
            font-size: 1rem;
            overflow-y: auto;
        }

        #projects-list {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        
        .project {
            text-align: center;
            margin: 0 auto;
            font-family: "IBM Plex Mono", monospace;

        }

        .project.collapsed .project-images,
        .project.collapsed .project-description,
        .project.collapsed .project-link {
            display: none;
        }

        .project.expanded .project-cover {
            display: none;
        }

        .carousel-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 110px 0 20px 0;
            width: 100vw;
            max-width: 100vw;
        }

        .carousel-modal {
            font-family: "IBM Plex Mono", monospace;
            position: relative;
            padding: 0px;
            width: 100vw;
            max-width: 100vw;
            max-height: 100vh;
            z-index: 1000;
            text-align: left;
        }

        .carousel-modal h3 {
            text-align: left;
            padding-left: 200px;
            font-size: 0.6rem;
            font-weight: 400;
            font-family: "IBM Plex Mono", monospace;
            line-height: 1;
        }

        .carousel-modal .project-images {
            margin-top: 0;
        }

        .project-cover {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr);
            align-items: stretch;
            width: 100%;
            margin-bottom: 20px;
            font-size: 0.6rem;
        }

        .project-cover .cover-info-left,
        .project-cover .cover-info-right {
            height: 100%;
            display: flex;
        }

        .project-cover .cover-info-left {
            justify-content: flex-end;
            padding-right: 24px;
            text-align: right;
            
        }

        .project-cover .cover-info-right {
            display: flex;
            flex-direction: column; /* stack items vertically */
            justify-content: flex-start;
            align-items: flex-start; /* keep content right-aligned */
            padding-right: 0px; /* match footer right gutter */
            text-align: left;
            gap: 6px;
            --archive-number-margin: 12px; /* shared margin for right-column items */
            margin-left: var(--archive-number-margin);
        }

        /* Archive entry and number on same row; change --archive-number-margin to adjust spacing */
        .project-cover .cover-info-right span {
            display: inline-flex;
            justify-content: flex-end;
            gap: 0.25rem;
            text-align: left;
            margin-left: var(--archive-number-margin);
            
            white-space: nowrap; /* keep label and number on same row */
        }

        .project-cover .project-meta-grid {
            display: flex;
            gap: 12px;
            text-align: left;
            align-items: flex-start;
            justify-content: flex-end;
            
        }

        .project-cover .project-meta-grid .meta-labels,
        .project-cover .project-meta-grid .meta-values {
            display: flex;
            flex-direction: column;
            text-align: left;
            width: auto;
            margin-left: var(--archive-number-margin);
            

        }

        .project-cover .project-meta-grid p {
            margin: 0;
            font-size: 0.6rem;
            opacity: 0.85;
            
        }

        .project-cover img {
            display: block;
            margin: 0 auto;
            height: auto;
            width: 200px;
            cursor: pointer;
        }

        .cover-cursor-label,
        .carousel-close-cursor {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 2000;
            cursor: pointer;
            pointer-events: none;
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.6rem;
            line-height: 1;
            letter-spacing: 0.02em;
            mix-blend-mode: difference;
            color: #ffffff;
            transform: translate(12px, 12px);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .cover-cursor-label.visible,
        .carousel-close-cursor.visible {
            opacity: 1;
        }

        .project-cover h3 {
            margin: 0;
            text-align: left;
            display: block;
            background: none;
            color: inherit;
            padding: 0;
            text-decoration: none;
            font-size: 0.6rem;
            font-weight: 400;
            font-family: "IBM Plex Mono", monospace;
            line-height: 1;
        }

        .project-images {
            display: flex;
            overflow-x: scroll;
            overflow-y: hidden;
            gap: 10px;
            align-items: flex-start;
            margin-top: 8px;
            scroll-behavior: smooth;
            padding: 8px 0;
            /* Hide scrollbar while keeping functionality */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .project-images::-webkit-scrollbar {
            display: none;
        }
 
        .project-img {
            height: 70vh;
            width: auto;
            flex-shrink: 0;
        }
        .project-description-slide {
            height: 70vh;
            width: 300px;
            flex-shrink: 0;
            padding-left: 20px;
            padding-top: 1.4rem;
            box-sizing: border-box;
            position: relative;
            text-align: left;
            font-family: "helvetica-neue-lt-pro", sans-serif;
            font-size: 1rem;
            font-weight: 400;
            white-space: normal;
        }

        .description-language-toggle {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 1;
            display: flex;
            gap: 0.2em;
            align-items: baseline;
            font: inherit;
            line-height: 1;
            white-space: nowrap;
        }

        .description-language-toggle button {
            padding: 0;
            border: 0;
            background: none;
            color: rgba(0, 0, 0, 0.5);
            font: inherit;
            line-height: inherit;
            cursor: pointer;
        }

        .description-language-toggle button.active {
            color: #000000;
        }

        .description-language-toggle .language-slash {
            color: #000000;
        }

        .project-description-word {
            opacity: 0;
            display: inline; /* allow text-decoration to cross words and wrap per line */
            transition: opacity 0.04s ease;
        }

        .project-description-word.visible {
            opacity: 1;
        }
        
        /* Per-line highlight wrapper to allow box-shadow 'bands' per wrapped line */
        .desc-highlight {
            display: inline; /* keep as inline so it breaks across lines */
            padding: 0; /* vertical padding for band */
            background-color: #ffffff;
            box-shadow: 0.5em 0 0 #ffffff, -1em 0 0 #ffffff;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;

        }
        .project-description,
        .project-link {
            margin-top: 100px;
        }

</style>
</head>
<body>
    
    <header>
        <h1></h1>
    </header>
    <main>
        <div id="projects-list">
            <p>Loading projects…</p>
        </div>

     </main>
    <footer>
            <p><a href="index.html">Acts of Service</a></p>
            <p><a href="about.html">About us</a></p>
            <p><a href="archive.html">Archive</a></p>
            <p><a href="contact.html">Contact</a></p>

    </footer>
<script src="screensaver.js"></script>
<script>
let currentModal = null;

const archiveHeading = document.querySelector('header h1');
const defaultArchiveHTML = archiveHeading ? archiveHeading.innerHTML : '';

fetch('projects.json')
    .then(res => res.json())
    .then(projects => {
        const container = document.getElementById('projects-list');
        container.innerHTML = '';

        if (!projects.length) {
            container.innerHTML = '<p>No projects yet — add one in the CMS.</p>';
            return;
        }

        projects.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project collapsed';

            // Combine cover image and gallery images
            const allImages = [];
            if (p.image) {
                allImages.push(p.image);
            }
            if (p.gallery && p.gallery.length) {
                allImages.push(...p.gallery);
            }

            // Cover image section
                let coverHtml = p.image
                    ? `<div class="project-cover">
                    <div class="cover-info-left"><h3>${p.title}</h3></div>
                    <img src="${p.image}" alt="${p.title}">
                    <div class="cover-info-right"></div>
                       </div>`
                    : `<div class="project-cover"><div class="cover-info-left"><h3>${p.title}</h3></div><div class="cover-info-right"></div></div>`;

                // Insert meta fields (Date, Commissioner, Category) if provided by the CMS
                const dateStr = p.date ? new Date(p.date).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                const commissionerStr = p.commissioner || '';
                const categoryStr = p.category || '';

                const entryNumber = projects.length - projects.indexOf(p);
                if (dateStr || commissionerStr || categoryStr || entryNumber) {
                    const temp = document.createElement('div');
                    temp.innerHTML = coverHtml;
                    const right = temp.querySelector('.cover-info-right');
                    if (right) {
                        // simple two-column container: left = labels, right = values
                        const grid = document.createElement('div');
                        grid.className = 'project-meta-grid';

                        const labels = document.createElement('div');
                        labels.className = 'meta-labels';
                        const values = document.createElement('div');
                        values.className = 'meta-values';

                        // Archive entry first
                        const lpEntry = document.createElement('p');
                        lpEntry.textContent = 'Archive entry:';
                        labels.appendChild(lpEntry);
                        const vpEntry = document.createElement('p');
                        vpEntry.textContent = `[${entryNumber}]`;
                        values.appendChild(vpEntry);

                

                        if (dateStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Date:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = dateStr;
                            values.appendChild(vp);
                        }
                        if (commissionerStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Commissioner:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = commissionerStr;
                            values.appendChild(vp);
                        }
                        if (categoryStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Category:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = categoryStr;
                            values.appendChild(vp);
                        }

                        grid.appendChild(labels);
                        grid.appendChild(values);
                        right.appendChild(grid);
                        coverHtml = temp.innerHTML;
                    }
                }

            div.innerHTML = coverHtml;

            // Add click event to the cover image to open modal
            const coverImg = div.querySelector('.project-cover img');
            if (coverImg) {
                const openCursor = document.createElement('div');
                openCursor.className = 'cover-cursor-label';
                openCursor.textContent = 'open';
                document.body.appendChild(openCursor);

                const positionOpenCursor = (e) => {
                    openCursor.style.left = `${e.clientX}px`;
                    openCursor.style.top = `${e.clientY}px`;
                    openCursor.classList.add('visible');
                };

                coverImg.addEventListener('pointermove', positionOpenCursor);
                coverImg.addEventListener('pointerenter', positionOpenCursor);
                coverImg.addEventListener('pointerleave', () => {
                    openCursor.classList.remove('visible');
                });

                coverImg.addEventListener('click', () => {

                    archiveHeading.innerHTML = p.title || '';

                    // Close any existing modal
                    if (currentModal) {
                        currentModal.remove();
                    }

                    openCursor.classList.remove('visible');

                    // Create overlay
                    const overlay = document.createElement('div');
                    overlay.className = 'carousel-modal-overlay';
                    overlay.style.cursor = 'pointer';

                    const closeCursor = document.createElement('div');
                    closeCursor.className = 'carousel-close-cursor';
                    closeCursor.textContent = 'close';
                    overlay.appendChild(closeCursor);

                    const positionCloseCursor = (e) => {
                        closeCursor.style.left = `${e.clientX}px`;
                        closeCursor.style.top = `${e.clientY}px`;
                        closeCursor.classList.add('visible');
                    };

                    overlay.addEventListener('pointermove', positionCloseCursor);
                    overlay.addEventListener('pointerenter', positionCloseCursor);
                    overlay.addEventListener('pointerleave', () => {
                        closeCursor.classList.remove('visible');
                    });

                    const initialPointerX = window.innerWidth / 2;
                    const initialPointerY = window.innerHeight / 2;
                    closeCursor.style.left = `${initialPointerX}px`;
                    closeCursor.style.top = `${initialPointerY}px`;
                    closeCursor.classList.add('visible');

                    // Create modal
                    const modal = document.createElement('div');
                    modal.className = 'carousel-modal';

                    // Carousel section with description as first slide
                    const descriptions = {
                        ENG: p.descriptionEnglish || p.description || '',
                        SWE: p.descriptionSwedish || p.descriptionEnglish || p.description || ''
                    };
                    let selectedLanguage = 'ENG';

                    const createDescriptionMarkup = (language) => {
                        const descriptionText = descriptions[language];
                        const words = descriptionText.split(/\s+/).filter(Boolean);
                        const wordsHtml = words.map((word, index) =>
                            `<span class="project-description-word" style="transition-delay:${index * 10}ms">${word}</span>`
                        ).join(' ');

                        return `<div class="description-language-toggle" aria-label="Description language">
                            <button type="button" class="${language === 'ENG' ? 'active' : ''}" data-language="ENG" aria-pressed="${language === 'ENG'}">ENG</button>
                            <span class="language-slash">/</span>
                            <button type="button" class="${language === 'SWE' ? 'active' : ''}" data-language="SWE" aria-pressed="${language === 'SWE'}">SWE</button>
                        </div><span class="desc-highlight">${wordsHtml}</span>`;
                    };

                    const descriptionSlide = descriptions.ENG || descriptions.SWE
                        ? `<div class="project-description-slide">${createDescriptionMarkup(selectedLanguage)}</div>`
                        : '';

                    const carouselHtml = allImages.length > 0 || descriptions.ENG || descriptions.SWE
                        ? `<div class="project-images" data-carousel>
                            ${descriptionSlide}
                            ${allImages.map(imgPath => `<img class="project-img" src="${imgPath}" alt="${p.title}">`).join('')}
                           </div>`
                        : '';

                    const linkHtml = p.link
                        ? `<p class="project-link"><a href="${p.link}" target="_blank">View project →</a></p>`
                        : '';

                    modal.innerHTML = `
                        ${carouselHtml}
                        ${linkHtml}
                    `;

                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);
                    currentModal = overlay;

                    const descriptionElement = modal.querySelector('.project-description-slide');
                    const animateDescription = () => {
                        const descriptionWords = descriptionElement.querySelectorAll('.project-description-word');
                        descriptionWords.forEach((word, index) => {
                            word.classList.remove('visible');
                            setTimeout(() => {
                                word.classList.add('visible');
                            }, index * 10);
                        });
                    };

                    const renderDescription = (language) => {
                        selectedLanguage = language;
                        descriptionElement.innerHTML = createDescriptionMarkup(language);
                        descriptionElement.querySelectorAll('[data-language]').forEach((button) => {
                            button.addEventListener('click', (e) => {
                                e.stopPropagation();
                                renderDescription(button.dataset.language);
                            });
                        });
                        animateDescription();
                    };

                    if (descriptionElement) {
                        renderDescription('ENG');
                    }

                    // Close modal on overlay click
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay || e.target === closeCursor) {
                            overlay.remove();
                            currentModal = null;
                            if (archiveHeading) archiveHeading.innerHTML = defaultArchiveHTML;
                            closeCursor.classList.remove('visible');
                        }
                    });

                    // Close modal on any click inside (except links)
                    modal.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'A') {
                            overlay.remove();
                            currentModal = null;
                            if (archiveHeading) archiveHeading.innerHTML = defaultArchiveHTML;
                            closeCursor.classList.remove('visible');
                            document.querySelectorAll('.project-cover h3').forEach((title) => {
                                title.classList.remove('fading');
                            });
                        }
                    });
                });
            }

            container.appendChild(div);
        });
    })
    .catch(err => {
        console.error('Could not load projects.json', err);
        document.getElementById('projects-list').innerHTML =
            '<p>Could not load projects right now.</p>';
    });
</script>
</body>
</html>
