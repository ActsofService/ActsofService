<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="aos-icon.svg">
    <title>Subpage — Acts of Service</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="screensaver.css">
    <style>
        @font-face {
            font-family: "ABC Areal";
            src: url("fonts/ABCArealSuperfamilyVariable.woff2") format("woff2");
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
        }
    </style>
      <style>
        html,
    body {
            height: 100%;
        }
        body {
            margin: 0;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "wght" 400, "slnt" 0, "DRKM" 0, "MONO" 100;
            font-weight: 400;
            font-style: normal;
            display: flex;
            font-variation-settings: "wght" 100, "slnt" 0, "DRKM" 0, "MONO" 100;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }
        footer {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 0;
            z-index: 10;
            margin: 0;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 0;
            font-weight: 400;
            line-height: 60%;
            font-size: 2.2rem;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }
        header {
            position: fixed;
            z-index: 1001;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 0;
            font-size: 2.2rem;
            line-height: 1;
            text-align: left;
            pointer-events: none;
        }
        header h1{
            margin: 20px 0px 0px 20px;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }
        a:hover {
            color: #c5e364;
        }
        main {
            margin: 0px 20px;
            padding: 100px 0;
            text-align: center;
            flex: 1;
            font-size: 1rem;
            overflow-y: auto;
        }


        #projects-list {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        
        .project {
            text-align: center;
            margin: 0 auto;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 100;

        }

        .project.collapsed .project-images,
        .project.collapsed .project-description,
        .project.collapsed .project-link {
            display: none;
        }

        .project.expanded .project-cover {
            display: none;
        }

        .carousel-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 110px 0 20px 0;
            width: 100vw;
            max-width: 100vw;
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            animation: modalOverlayFadeIn 0.28s ease forwards;
        }

        @keyframes modalOverlayFadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0px);
                -webkit-backdrop-filter: blur(0px);
            }
            to {
                opacity: 1;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
        }

        @keyframes modalOverlayFadeOut {
            from {
                opacity: 1;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }
            to {
                opacity: 0;
                backdrop-filter: blur(0px);
                -webkit-backdrop-filter: blur(0px);
            }
        }

        .carousel-modal {
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 100;
            position: relative;
            padding: 0px;
            width: 100vw;
            max-width: 100vw;
            max-height: 100vh;
            z-index: 1000;
            text-align: left;
        }

        .carousel-modal h3 {
            text-align: left;
            padding-left: 200px;
            font-weight: 400;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 100;
            line-height: 1;
        }

        .carousel-modal .project-images {
            margin-top: 0;
        }

        .project-cover {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 30vw) minmax(0, 1fr);
            column-gap: 20px;
            align-items: stretch;
            width: 100%;
            margin-bottom: 60px;
            font-size: 0.6rem;
            cursor: pointer;
        }

        .project-cover .cover-info-left,
        .project-cover .cover-info-right {
            height: 100%;
            display: flex;
        }

        .project-cover .cover-info-left {
            justify-content: flex-end;
            text-align: right;
            
        }

        .project-cover .cover-info-right {
            display: flex;
            flex-direction: column; /* stack items vertically */
            justify-content: flex-start;
            align-items: flex-start; /* keep content right-aligned */
            text-align: left;
            gap: 6px;
        }

        /* Archive entry and number on same row; change --archive-number-margin to adjust spacing */
        .project-cover .cover-info-right span {
            display: inline-flex;
            justify-content: flex-end;
            gap: 0.25rem;
            text-align: left;
            
            white-space: nowrap; /* keep label and number on same row */
        }

        .project-cover .project-meta-grid {
            display: flex;
            gap: 12px;
            text-align: left;
            align-items: flex-start;
            justify-content: flex-end;
            
        }

        .project-cover .project-meta-grid .meta-labels,
        .project-cover .project-meta-grid .meta-values {
            display: flex;
            flex-direction: column;
            text-align: left;
            width: auto;
            

        }

        .project-cover .project-meta-grid p {
            margin: 0;
            font-size: 0.6rem;
            opacity: 0.85;
            
        }

        .project-cover img {
            display: block;
            margin: 0 auto;
            height: auto;
            width: 100%;
            max-width: 100%;
            cursor: inherit;
        }

        .project-cover h3 {
            margin: 0;
            text-align: left;
            display: block;
            background: none;
            color: inherit;
            padding: 0;
            text-decoration: none;
            font-size: 0.6rem;
            font-weight: 400;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 100;
            line-height: 1;
        }

        .project-images {
            display: flex;
            overflow-x: scroll;
            overflow-y: hidden;
            gap: 20px;
            align-items: flex-start;
            margin-top: 8px;
            scroll-behavior: smooth;
            padding: 8px 30vw 8px 0;
            /* Hide scrollbar while keeping functionality */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .project-images::-webkit-scrollbar {
            display: none;
        }
 
        .project-img,
        .project-video {
            height: 70vh;
            width: auto;
            flex-shrink: 0;
            display: block;
            object-fit: contain;
            background: #f4f4f4;
        }
        .project-description-slide {
            height: 70vh;
            width: 370px;
            flex-shrink: 0;
            padding-left: 20px;
            padding-top: 1.4rem;
            box-sizing: border-box;
            position: relative;
            text-align: left;
            font-family: "ABC Areal", sans-serif;
            font-variation-settings: "slnt" 0, "DRKM" 0, "MONO" 0;
            font-size: 1rem;
            font-weight: 400;
            white-space: normal;
        }

        .description-language-toggle {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 1;
            display: flex;
            gap: 0.2em;
            align-items: baseline;
            font: inherit;
            line-height: 1;
            white-space: nowrap;
        }

        .description-language-toggle button {
            padding: 0;
            border: 0;
            background: none;
            color: rgba(0, 0, 0, 0.5);
            font: inherit;
            line-height: inherit;
            cursor: pointer;
        }

        .description-language-toggle button.active {
            color: #000000;
        }

        .description-language-toggle .language-slash {
            color: #000000;
        }

        .project-description-word {
            opacity: 0;
            display: inline; /* allow text-decoration to cross words and wrap per line */
            transition: opacity 0.04s ease;
        }

        .project-description-word.visible {
            opacity: 1;
        }
        
        /* Per-line highlight wrapper to allow box-shadow 'bands' per wrapped line */
        .desc-highlight {
            display: inline; /* keep as inline so it breaks across lines */
            padding: 0; /* vertical padding for band */
            background-color: #ffffff;
            box-shadow: 0.5em 0 0 #ffffff, -1em 0 0 #ffffff;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;

        }
        .project-description,
        .project-link {
            margin-top: 100px;
        }

        @media (max-width:  1100px) {
            main {
                padding: 100px 20px;
                margin: 0;
            }

            footer {
            font-size: 1.3rem;
        }

            #projects-list {
                max-width: 700px;
            }

            .project-cover {
                grid-template-columns: minmax(0, 1fr);
                row-gap: 10px;
                margin-bottom: 60px;
            }

            .project-cover .cover-info-left {
                order: 1;
                justify-content: center;
                text-align: center;
            }

            .project-cover img {
                order: 2;
                width: min(70vw, 500px);
                max-width: 100%;
            }

            .project-cover .cover-info-right {
                order: 3;
                justify-content: flex-start;
                align-items: center;
                text-align: center;
            }

            .project-cover .project-meta-grid {
                justify-content: center;
                text-align: left;
            }

            .project-cover .project-meta-grid .meta-labels,
            .project-cover .project-meta-grid .meta-values {
                text-align: left;
            }
        }

        @media (max-width: 700px) {
            .carousel-modal-overlay {
                overflow-y: auto;
                align-items: flex-start;
            }

            .carousel-modal {
                width: 100%;
                max-width: 100%;
            }

            .carousel-modal .project-images {
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow-x: hidden;
                overflow-y: visible;
                gap: 20px;
                padding: 8px 0 30px;
            }

            .project-description-slide {
                width: 90vw;
                height: auto;
                min-height: 0;
                flex-shrink: 0;
                padding: 1.4rem 0 0;
            }

            .project-img,
            .project-video {
                width: 90vw;
                max-width: 90vw;
                height: auto;
                flex-shrink: 0;
            }
        }

</style>
</head>
<body>
    
    <header>
        <h1></h1>
    </header>
    <main>
        <div id="projects-list">
            <p>Loading projects…</p>
        </div>

     </main>
    <footer>
            <p><a href="index.html">Home</a></p>
            <p><a href="archive.html">Archive</a></p>
            <p><a href="foundry.html">AOS Foundry</a></p>
            <p><a href="contact.html">Contact</a></p>

    </footer>
<script src="screensaver.js"></script>
<script>
let currentModal = null;

const archiveHeading = document.querySelector('header h1');
const defaultArchiveHTML = archiveHeading ? archiveHeading.innerHTML : '';

fetch('projects.json')
    .then(res => res.json())
    .then(projects => {
        const container = document.getElementById('projects-list');
        container.innerHTML = '';

        if (!projects.length) {
            container.innerHTML = '<p>No projects yet — add one in the CMS.</p>';
            return;
        }

        projects.forEach(p => {
            const div = document.createElement('div');
            div.className = 'project collapsed';

            const resolveMediaSrc = (src) => {
                if (!src || /^(https?:|data:|\/)/.test(src)) return src;
                return `/images/uploads/${src}`;
            };

            const getGalleryMedia = (project) => {
                const media = [];
                if (project.image) media.push({ type: 'image', src: resolveMediaSrc(project.image) });

                if (Array.isArray(project.gallery)) {
                    project.gallery.forEach(item => {
                        if (!item) return;
                        if (typeof item === 'string') {
                            media.push({ type: 'image', src: resolveMediaSrc(item) });
                            return;
                        }

                        const mediaType = (item.mediaType || '').toLowerCase();

                        if (item.image) media.push({ type: mediaType === 'gif' ? 'gif' : 'image', src: resolveMediaSrc(item.image) });
                        if (item.gif) media.push({ type: 'gif', src: resolveMediaSrc(item.gif) });
                        if (item.video) media.push({ type: 'video', src: resolveMediaSrc(item.video), poster: resolveMediaSrc(item.poster) });
                    });
                }

                return media;
            };

            const galleryMedia = getGalleryMedia(p);

            // Cover image section
                let coverHtml = p.image
                    ? `<div class="project-cover">
                    <div class="cover-info-left"><h3>${p.title}</h3></div>
                    <img src="${resolveMediaSrc(p.image)}" alt="${p.title}">
                    <div class="cover-info-right"></div>
                       </div>`
                    : `<div class="project-cover"><div class="cover-info-left"><h3>${p.title}</h3></div><div class="cover-info-right"></div></div>`;

                // Insert meta fields (Date, Commissioner, Category) if provided by the CMS
                const dateStr = p.date ? new Date(p.date).toLocaleDateString(undefined, { year: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
                const commissionerStr = p.commissioner || '';
                const categoryStr = p.category || '';

                const entryNumber = projects.length - projects.indexOf(p);
                if (dateStr || commissionerStr || categoryStr || entryNumber) {
                    const temp = document.createElement('div');
                    temp.innerHTML = coverHtml;
                    const right = temp.querySelector('.cover-info-right');
                    if (right) {
                        // simple two-column container: left = labels, right = values
                        const grid = document.createElement('div');
                        grid.className = 'project-meta-grid';

                        const labels = document.createElement('div');
                        labels.className = 'meta-labels';
                        const values = document.createElement('div');
                        values.className = 'meta-values';

                        // Archive entry first
                        const lpEntry = document.createElement('p');
                        lpEntry.textContent = 'Archive entry:';
                        labels.appendChild(lpEntry);
                        const vpEntry = document.createElement('p');
                        vpEntry.textContent = `[${entryNumber}]`;
                        values.appendChild(vpEntry);

                

                        if (dateStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Date:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = dateStr;
                            values.appendChild(vp);
                        }
                        if (commissionerStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Commissioner:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = commissionerStr;
                            values.appendChild(vp);
                        }
                        if (categoryStr) {
                            const lp = document.createElement('p');
                            lp.textContent = 'Category:';
                            labels.appendChild(lp);
                            const vp = document.createElement('p');
                            vp.textContent = categoryStr;
                            values.appendChild(vp);
                        }

                        grid.appendChild(labels);
                        grid.appendChild(values);
                        right.appendChild(grid);
                        coverHtml = temp.innerHTML;
                    }
                }

            div.innerHTML = coverHtml;

            // Add click event to the cover image to open modal
            const coverImg = div.querySelector('.project-cover img');
            if (coverImg) {
                div.addEventListener('click', () => {

                    archiveHeading.innerHTML = p.title || '';

                    // Close any existing modal
                    if (currentModal) {
                        currentModal.remove();
                    }
                    // Create overlay
                    const overlay = document.createElement('div');
                    overlay.className = 'carousel-modal-overlay';

                    // Create modal
                    const modal = document.createElement('div');
                    modal.className = 'carousel-modal';

                    // Carousel section with description as first slide
                    const descriptions = {
                        ENG: p.descriptionEnglish || p.description || '',
                        SWE: p.descriptionSwedish || p.descriptionEnglish || p.description || ''
                    };
                    let selectedLanguage = 'ENG';

                    const escapeHtml = (value) => value
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');

                    const markdownToHtml = (value) => escapeHtml(value)
                        .replace(/\t/g, '<br>')
                        .replace(/\r?\n/g, '<br>')
                        .replace(/\+\+(.+?)\+\+/g, '<u>$1</u>')
                        .replace(/~~(.+?)~~/g, '<s>$1</s>')
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.+?)\*/g, '<em>$1</em>');

                    const createDescriptionMarkup = (language) => {
                        const descriptionHtml = markdownToHtml(descriptions[language]);

                        return `<div class="description-language-toggle" aria-label="Description language">
                            <button type="button" class="${language === 'ENG' ? 'active' : ''}" data-language="ENG" aria-pressed="${language === 'ENG'}">ENG</button>
                            <span class="language-slash">/</span>
                            <button type="button" class="${language === 'SWE' ? 'active' : ''}" data-language="SWE" aria-pressed="${language === 'SWE'}">SWE</button>
                        </div><span class="desc-highlight">${descriptionHtml}</span>`;
                    };

                    const descriptionSlide = descriptions.ENG || descriptions.SWE
                        ? `<div class="project-description-slide">${createDescriptionMarkup(selectedLanguage)}</div>`
                        : '';

                    const renderMediaSlide = (media) => {
                        if (!media || !media.src) return '';
                        if (media.type === 'video') {
                            return `<video class="project-video" src="${media.src}"${media.poster ? ` poster="${media.poster}"` : ''} controls playsinline muted loop></video>`;
                        }
                        return `<img class="project-img" src="${media.src}" alt="${p.title}">`;
                    };

                    const carouselHtml = galleryMedia.length > 0 || descriptions.ENG || descriptions.SWE
                        ? `<div class="project-images" data-carousel>
                            ${descriptionSlide}
                            ${galleryMedia.map(renderMediaSlide).join('')}
                           </div>`
                        : '';

                    modal.innerHTML = `
                        ${carouselHtml}
                    `;

                    overlay.appendChild(modal);
                    document.body.appendChild(overlay);
                    currentModal = overlay;

                    const descriptionElement = modal.querySelector('.project-description-slide');
                    const renderDescription = (language) => {
                        selectedLanguage = language;
                        descriptionElement.innerHTML = createDescriptionMarkup(language);
                        descriptionElement.querySelectorAll('[data-language]').forEach((button) => {
                            button.addEventListener('click', (e) => {
                                e.stopPropagation();
                                renderDescription(button.dataset.language);
                            });
                        });
                    };

                    if (descriptionElement) {
                        renderDescription('ENG');
                    }

                    const closeModal = () => {
                        modal.style.opacity = '0';
                        modal.style.transition = 'opacity 0s linear';
                        if (archiveHeading) archiveHeading.innerHTML = defaultArchiveHTML;
                        overlay.style.animation = 'modalOverlayFadeOut 0.22s ease forwards';
                        setTimeout(() => {
                            overlay.remove();
                            currentModal = null;
                        }, 220);
                    };

                    // Close modal on overlay click
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            closeModal();
                        }
                    });

                    // Close modal on any click inside (except links)
                    modal.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'A') {
                            closeModal();
                            document.querySelectorAll('.project-cover h3').forEach((title) => {
                                title.classList.remove('fading');
                            });
                        }
                    });
                });
            }

            container.appendChild(div);
        });
    })
    .catch(err => {
        console.error('Could not load projects.json', err);
        document.getElementById('projects-list').innerHTML =
            '<p>Could not load projects right now.</p>';
    });
</script>
</body>
</html>
